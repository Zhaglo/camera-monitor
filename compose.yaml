services:
  camera-fast:
    build: .
    ports:
      - "127.0.0.1:8002:8000"

  camera-slow:
    build: .
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      DEVICE_DELAY: "2"

  camera-failing:
    build: .
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      DEVICE_FAIL: "1"