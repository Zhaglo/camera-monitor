services:
  camera-fast:
    build: .
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DEVICE_ID: "camera-fast"

  camera-slow:
    build: .
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      DEVICE_ID: "camera-slow"
      DEVICE_DELAY: "2"

  camera-failing:
    build: .
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      DEVICE_ID: "camera-failing"
      DEVICE_FAIL: "1"

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: learning